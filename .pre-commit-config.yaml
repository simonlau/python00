repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
    rev: v0.17.4
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1  # Replace with the latest version or git tag
    hooks:
      - id: mypy
        # Add third-party type stubs here if your project needs them
        additional_dependencies: [] 

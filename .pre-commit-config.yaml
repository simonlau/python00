exclude: "^.agents/"

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix', '--indent=2', '--no-ensure-ascii']
      - id: check-toml
      - id: check-xml
      - id: requirements-txt-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: forbid-new-submodules
      - id: detect-private-key
      - id: check-vcs-permalinks
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
    rev: v0.17.4
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pycqa/flake8
    rev: 7.4.1  # Use the latest stable git tag or commit hash
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1  # Replace with the latest version or git tag
    hooks:
      - id: mypy
        # Add third-party type stubs here if your project needs them
        additional_dependencies: []

  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.99
    hooks:
      - id: ty
